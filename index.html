    <script>
        /* Mark JS active before paint so anime.js pre-states apply (no FOUC if JS off) */
        (function () {
            try {
                var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (!rm) document.documentElement.classList.add('js-anim');
            } catch (e) {}
        })();
    </script>

<body class="blue lighten-5">
<!-- Lang Toggle -->
<div class="lang-toggle" role="group" aria-label="Language toggle">
    <button class="lang-btn" id="btn-id" data-lang="id" aria-pressed="false" title="Bahasa Indonesia">
        <span class="lang-flag">ID</span><span>Indonesia</span>
    </button>
    <button class="lang-btn" id="btn-en" data-lang="en" aria-pressed="false" title="English">
        <span class="lang-flag">EN</span><span>English</span>
    </button>
</div>

<!-- ============ HERO ============ -->
<section id="home" class="hero-x snap-section">
    <!-- background layers -->
    <div class="hero-bg" aria-hidden="true">
        <div class="hero-grid-mesh"></div>
        <div class="hero-blob hero-blob-1"></div>
        <div class="hero-blob hero-blob-2"></div>
        <div class="hero-blob hero-blob-3"></div>
        <div class="hero-noise"></div>
    </div>

    <div class="hero-x-inner">
        <!-- LEFT: kinetic typography -->
        <div class="hero-x-left">
            <p class="hero-greeting" data-hx="greeting" data-i18n="hero.hi">Hi, I'm</p>

            <h1 class="hero-name" data-hx="name">Andreafif Cyto Prasadana Sutrisno</h1>

            <div class="hero-roles" data-hx="roles" aria-live="polite">
                <span class="hero-roles-prefix">&lt;</span>
                <span class="hero-roles-word" id="hero-rotating-role">Android Developer</span>
                <span class="hero-roles-caret">|</span>
                <span class="hero-roles-prefix">/&gt;</span>
            </div>

            <p class="hero-x-desc" data-hx="desc" data-i18n="hero.pitch"></p>

            <div class="hero-stats" data-hx="stats" id="hero-stats"></div>

            <div class="hero-x-cta" data-hx="cta">
                <a href="#projects" class="btn-x btn-x-primary magnetic" id="cta-projects">
                    <span><i class="material-icons">work</i><span data-i18n="cta.projects">Lihat Projects</span></span>
                </a>
                <a href="#contact" class="btn-x btn-x-ghost magnetic" id="cta-contact">
                    <span><i class="material-icons">mail</i><span data-i18n="cta.contact">Kontak</span></span>
                </a>
                <a id="btn-download-cv" class="btn-x btn-x-ghost magnetic"
                   href="https://docs.google.com/document/d/1LV61tOvi8_LSL7fom3hlyUVSM348SWBMf6ScDdkh4QQ/export?format=pdf"
                   target="_blank" rel="noopener">
                    <span><i class="material-icons">file_download</i><span data-i18n="cta.cv">CV</span></span>
                </a>
            </div>
        </div>

        <!-- RIGHT: photo centerpiece + orbiting tech -->
        <div class="hero-x-right" data-hx="photo">
            <div class="hero-photo-stage" id="hero-photo-stage">
                <div class="hero-photo-glow"></div>
                <div class="hero-photo-ring hero-photo-ring-1"></div>
                <div class="hero-photo-ring hero-photo-ring-2"></div>
                <div class="hero-orbit" id="hero-orbit"></div>
                <div class="hero-photo-wrap">
                    <img src="assets/img/photo_no_bg.png" alt="Andreafif Cyto Prasadana Sutrisno" class="hero-photo">
                </div>
            </div>
        </div>
    </div>

    <button class="scroll-hint" type="button" aria-label="Scroll down">
        <span data-i18n="scroll.hint">Scroll ke bawah</span>
        <i class="material-icons">keyboard_arrow_down</i>
    </button>
</section>

<div class="section-bridge" aria-hidden="true"></div>
